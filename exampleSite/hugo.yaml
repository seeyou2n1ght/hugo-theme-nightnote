baseURL: https://example.org/
title: Nightnote
locale: zh-CN
hasCJKLanguage: true
defaultContentLanguage: zh
languages:
  zh:
    locale: zh-CN
theme: nightnote
enableRobotsTXT: true
frontmatter:
  date: [published, date]
taxonomies:
  category: category
  tag: tags
  collection: collection
permalinks:
  posts: /posts/:slug/
  projects: /projects/:slug/
  taxonomy:
    category: /topics/
    collection: /collections/
  term:
    category: /topics/:slug/
    collection: /collections/:slug/
outputs:
  home: [HTML, RSS, Search]
  section: [HTML]
  taxonomy: [HTML]
  term: [HTML]
outputFormats:
  Search:
    mediaType: application/json
    baseName: search
    isPlainText: true
    notAlternative: true
markup:
  highlight:
    noClasses: true
  goldmark:
    parser:
      attribute:
        block: true
        title: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$']]
          inline: [['$', '$']]
params:
  intro: 做些东西，解决重复的问题，也把学到的东西写下来。
  focus: 关注效率、知识组织与可靠的软件。
