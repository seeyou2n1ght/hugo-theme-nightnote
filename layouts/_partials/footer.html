<footer class="site-footer shell"><span>© {{ now.Year }} {{ site.Title }}</span><span><a href="{{ "index.xml" | relURL }}">RSS</a>{{ with site.Params.github }} · <a href="{{ . }}">GitHub</a>{{ end }}{{ with site.Params.email }} · <a href="mailto:{{ . }}">邮箱</a>{{ end }}</span></footer>
<dialog id="search-dialog" data-index="{{ "search.json" | relURL }}" aria-label="搜索"><form method="dialog"><button class="close" aria-label="关闭搜索">×</button></form><label for="search-input">搜索</label><input id="search-input" type="search" autocomplete="off" placeholder="搜索文章、项目和专题…"><div id="search-results" role="status"></div></dialog>
