<header class="site-header"><nav class="shell nav" aria-label="主导航">
  <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
  <button class="mobile-menu" type="button" aria-expanded="false" aria-controls="main-links">菜单</button>
  <div id="main-links" class="nav-links">
    <a href="{{ "explore/" | relURL }}"{{ if or (eq .Section "explore") (eq .Kind "term") (eq .Kind "taxonomy") }} aria-current="page"{{ end }}>探索</a><a href="{{ "projects/" | relURL }}"{{ if eq .Section "projects" }} aria-current="page"{{ end }}>项目</a><a href="{{ "about/" | relURL }}"{{ if eq .RelPermalink ("about/" | relURL) }} aria-current="page"{{ end }}>关于</a>
    <div class="nav-actions">
    <button class="icon-button" type="button" data-random-article aria-label="随机阅读一篇文章" title="随机阅读一篇文章"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/></svg></button>
    <button class="icon-button" type="button" data-search-open aria-label="搜索" title="搜索（Ctrl/⌘ K）"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 5 5"/></svg></button>
    <button class="icon-button" id="theme-choice" type="button" aria-label="切换外观" title="切换外观"><svg class="theme-icon theme-icon-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg><svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.8A8.5 8.5 0 0 1 8.2 3.8 8.5 8.5 0 1 0 20.2 15.8Z"/></svg></button>
    </div>
  </div>
</nav></header>
